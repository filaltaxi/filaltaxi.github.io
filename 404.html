<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --paper: #f3f6f9; --grid: #dbe3ec; --ink: #0f2440; --muted: #4d6079; --copper: #b95f17; --panel: #ffffff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --paper: #0b1d33; --grid: #15304f; --ink: #dce7f5; --muted: #93a8c2; --copper: #e5904a; --panel: #0f2540; color-scheme: dark; } }
html, body { height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
.box { border: 2px solid var(--ink); background: var(--panel); padding: 32px; max-width: 460px; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--copper); font-weight: 600; }
h1 { font-family: "Archivo", Arial, sans-serif; font-size: 40px; margin: 8px 0 12px; line-height: 1.1; }
p { color: var(--muted); margin: 0 0 20px; line-height: 1.6; }
a { display: inline-block; background: var(--ink); color: var(--paper); padding: 10px 14px; text-decoration: none; font-size: 13px; font-weight: 600; }
a:hover { background: var(--copper); color: #fff; }
a:focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="box">
    <span class="label">Error 404</span>
    <h1>Sheet Not Found</h1>
    <p>This page isn’t in the drawing set. The portfolio is one page, and it starts at the front sheet.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
